name: Fehlermap
options:
  bundleIdPrefix: de.benjamindohna
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4PAABMJNV2

targets:
  FehlermapiOS:
    type: application
    platform: iOS
    sources:
      - FehlermapiOS
      - Shared
    dependencies:
      - target: FehlermapWatch
    settings:
      base:
        PRODUCT_NAME: Hansei
        PRODUCT_BUNDLE_IDENTIFIER: de.benjamindohna.fehlermap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hansei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  FehlermapWatch:
    type: application
    platform: watchOS
    sources:
      - FehlermapWatch
      - Shared
    entitlements:
      path: FehlermapWatch/FehlermapWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: FehlermapWatch/Info.plist
      properties:
        CFBundleDisplayName: Hansei
        WKApplication: true
        WKCompanionAppBundleIdentifier: de.benjamindohna.fehlermap
        WKBackgroundModes:
          - workout-processing
        NSMicrophoneUsageDescription: "Fehlermap nimmt deine Sprachnotizen während des Spiels auf."
        NSHealthShareUsageDescription: "Fehlermap nutzt eine Workout-Session, damit die App während des Spiels aktiv bleibt."
        NSHealthUpdateUsageDescription: "Fehlermap startet eine Workout-Session, damit die App während des Spiels aktiv bleibt."
    settings:
      base:
        PRODUCT_NAME: Hansei Watch
        PRODUCT_BUNDLE_IDENTIFIER: de.benjamindohna.fehlermap.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
